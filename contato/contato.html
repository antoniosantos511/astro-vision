<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="contato.css">

    <link rel="icon" type="image/png" href="/fotos/astro.png">
</head>

<body>

<section class="contact">

    <div class="title">
        <h1><span>Contato</span></h1>
        <p>Entre em contato conosco e descubra o universo!</p>
    </div>

    <div class="container">

        <div class="left">

            <h2>Entre em Contato</h2>

            <p>
              Tem alguma dúvida sobre o nosso Sistema Solar?
              Envie uma mensagem para nós!
            </p>

            <form>

                <div class="row">

                    <input type="text" placeholder="Last Name">

                    <input type="text" placeholder="First Name">

                </div>

                <input type="email" placeholder="Email">

                <input type="text" placeholder="Phone Number">

                <textarea placeholder="conteudo da mensagem"></textarea>

                <button>Send it to the moon 🚀</button>
               <a href="../index.html">Home</a>

            </form>
        </div>

    </div>

</section>

</body>
</html>
